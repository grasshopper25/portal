<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-br from-blue-50 via-white to-green-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full bg-white rounded-3xl shadow-2xl p-10 text-center border border-gray-100">
        <!-- Success Icon -->
        <div class="w-24 h-24 mx-auto rounded-full bg-green-100 flex items-center justify-center">
            <i class="ri-checkbox-circle-fill text-6xl text-green-600"></i>
        </div>
        <!-- Heading -->
        <h1 class="text-4xl font-bold text-gray-800 mt-8">Thank You!</h1>
        <!-- Message -->
        <p class="mt-5 text-lg text-gray-600 leading-8">
            Your enquiry has been submitted successfully.
            <br>
            Thank you for your interest in
            <span class="font-semibold text-green-700">
                Gouri Devi Institute of Medical Sciences & Hospital
            </span>.
        </p>
        <p class="mt-4 text-gray-500">
            Our admissions team will review your request and get back to you as soon as possible.
        </p>
        <!-- Buttons -->
        <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/"
                class="px-8 py-3 rounded-xl bg-green-600 hover:bg-green-700 text-white font-semibold transition duration-300">
                <i class="ri-home-4-line mr-2"></i>
                Back to Home
            </a>
        </div>
    </div>

</body>
</html>
